version: '3.8'
services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      - DATABASE_URL=postgres://user:pass@postgres:5432/nkndefi?sslmode=disable
      - REDIS_URL=redis:6379
      - NKN_RPC=https://mainnet-rpc.nkn.org
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: nkndefi
  redis:
    image: redis:7-alpine